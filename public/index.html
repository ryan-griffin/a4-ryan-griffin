<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="A simple coursework tracker for WPI assignments."
		/>
		<title>Due Soon | WPI Assignment Tracker</title>
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		/>
		<link rel="stylesheet" href="css/main.css" />
		<link rel="icon" href="data:;base64,iVBORw0KGgo=" />
		<script src="js/main.js" defer></script>
	</head>
	<body class="bg-light d-flex flex-column min-vh-100">
		<header class="navbar navbar-light bg-white border-bottom">
			<div
				class="container d-flex justify-content-between align-items-center"
			>
				<a class="navbar-brand fw-bold" href="/">Due Soon</a>
				<span class="d-flex align-items-center gap-2">
					<span
						id="user-label"
						class="text-muted small fw-bold"
						hidden
					></span>
					<button
						id="logout-button"
						class="btn btn-link btn-sm"
						type="button"
						hidden
					>
						Log out
					</button>
				</span>
			</div>
		</header>

		<main class="container py-4 flex-grow-1">
			<section
				id="login-card"
				class="card shadow-sm mx-auto"
				hidden
				style="max-width: 480px"
			>
				<div class="card-body">
					<h2 class="card-title h4">Log in</h2>
					<p class="card-text text-muted small">
						New accounts are created automatically on first login.
					</p>
					<form id="login-form">
						<div class="mb-3">
							<label class="form-label" for="login-username"
								>Username</label
							>
							<input
								class="form-control"
								id="login-username"
								name="username"
								type="text"
								maxlength="50"
								autocomplete="username"
								required
							/>
						</div>
						<div class="mb-3">
							<label class="form-label" for="login-password"
								>Password</label
							>
							<input
								class="form-control"
								id="login-password"
								name="password"
								type="password"
								maxlength="200"
								autocomplete="current-password"
								required
							/>
						</div>
						<div class="d-grid">
							<button
								class="btn btn-primary"
								id="login-button"
								type="submit"
							>
								Log in
							</button>
						</div>
					</form>
					<p
						id="login-error"
						class="alert alert-danger mt-3 mb-0"
						hidden
					></p>
				</div>
			</section>
			<div id="content-grid" class="row g-4" hidden>
				<section class="col-lg-8">
					<div class="card shadow-sm">
						<div class="card-body">
							<h2 class="card-title h4">Assignments</h2>
							<p
								id="results-caption"
								class="text-muted small border-bottom pb-3"
							>
								Loading assignments...
							</p>
							<div class="table-responsive">
								<table
									class="table table-striped table-hover align-middle mb-0"
								>
									<thead>
										<tr>
											<th scope="col">Assignment</th>
											<th scope="col">Course</th>
											<th scope="col">Due</th>
											<th scope="col">Days left</th>
											<th scope="col">Hours</th>
											<th scope="col">Priority</th>
											<th scope="col">Urgency</th>
											<th scope="col">Actions</th>
										</tr>
									</thead>
									<tbody id="assignment-rows">
										<tr>
											<td
												colspan="8"
												class="text-center text-muted"
											>
												Loading assignments...
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>
				</section>

				<section class="col-lg-4">
					<div class="card shadow-sm">
						<div class="card-body">
							<h2 id="form-title" class="card-title h4">
								Add an assignment
							</h2>
							<form
								id="assignment-form"
								class="border-top pt-3 mt-3"
							>
								<div class="row g-3">
									<div class="col-12">
										<label
											class="form-label"
											for="field-title"
											>Assignment name</label
										>
										<input
											class="form-control"
											id="field-title"
											name="title"
											type="text"
											maxlength="100"
											placeholder="e.g. Short Stack"
											required
										/>
									</div>
									<div class="col-12">
										<label
											class="form-label"
											for="field-course"
											>Course</label
										>
										<input
											class="form-control"
											id="field-course"
											name="course"
											type="text"
											maxlength="30"
											placeholder="e.g. CS 4241"
											required
										/>
									</div>
									<div class="col-6">
										<label
											class="form-label"
											for="field-due"
											>Due date</label
										>
										<input
											class="form-control"
											id="field-due"
											name="dueDate"
											type="date"
											required
										/>
									</div>
									<div class="col-6">
										<label
											class="form-label"
											for="field-hours"
											>Estimated hours</label
										>
										<input
											class="form-control"
											id="field-hours"
											name="hours"
											type="number"
											min="0.5"
											max="100"
											step="0.5"
											placeholder="4"
											required
										/>
									</div>
									<div class="col-12">
										<label
											class="form-label"
											for="field-priority"
											>Priority</label
										>
										<select
											class="form-select"
											id="field-priority"
											name="priority"
											required
										>
											<option value="" disabled>
												Select priority
											</option>
											<option value="high">High</option>
											<option value="medium" selected>
												Medium
											</option>
											<option value="low">Low</option>
										</select>
									</div>
								</div>
								<div class="d-flex gap-2 mt-3">
									<button
										class="btn btn-primary flex-fill"
										id="save-button"
										type="submit"
									>
										Add assignment
									</button>
									<button
										class="btn btn-secondary flex-fill"
										id="cancel-button"
										type="button"
										hidden
									>
										Cancel edit
									</button>
								</div>
							</form>
						</div>
					</div>
				</section>
			</div>
		</main>

		<footer
			class="container d-flex justify-content-between text-muted small py-3"
		>
			<span class="fw-bold">Due Soon</span>
			<span>Assignment data is stored per user in MongoDB.</span>
		</footer>
	</body>
</html>
